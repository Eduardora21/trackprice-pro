<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackPrice Pro - Dashboard</title>
  <!-- Tailwind CSS vía CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto">
    
    <!-- Header -->
    <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-cyan-400">TrackPrice Pro</h1>
        <p class="text-slate-400 text-sm">Monitoreo de precios en tiempo real</p>
      </div>
      <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        ● Servidor Activo
      </span>
    </header>

    <!-- Formulario de Rastrear -->
    <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700/50 mb-8">
      <h2 class="text-lg font-semibold mb-4 text-white">Rastrear Nuevo Producto / Vuelo</h2>
      <form id="trackForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input 
          type="text" 
          id="nombre" 
          placeholder="Nombre (ej. Vuelo a San José)" 
          class="bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500 text-white" 
          required
        >
        <input 
          type="url" 
          id="url" 
          placeholder="URL del sitio web" 
          class="bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500 text-white" 
          required
        >
        <input 
          type="text" 
          id="selector" 
          placeholder="Selector CSS (ej. .price)" 
          class="bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500 text-white" 
          required
        >
        <button 
          type="submit" 
          class="md:col-span-3 bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-3 rounded-lg transition duration-200"
        >
          Guardar y Consultar Precio
        </button>
      </form>
    </div>

    <!-- Contenedor para Estado de la Respuesta -->
    <div id="resultado" class="hidden p-4 mb-8 rounded-lg bg-slate-800 border border-cyan-500/30 text-sm"></div>

  </div>
</body>
</html>
